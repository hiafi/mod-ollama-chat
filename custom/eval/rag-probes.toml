# Retrieval probes for custom/rag (no API calls): python3 custom/eval/rag_probe.py
#   group    where | command | chitchat | case (the reply cases in cases/)
#   expect   ids that should land in the top 3; empty = nothing should be retrieved
#   zone, area  the bot's zone and area when the question is asked, passed to the location boost (RAGLocationBoost).
#            'case' probes take them from the case's [bot] table.
# The where/how questions name a place or quest the way a player would, and pick the entry the generated data gives.

# --- where / how: four starting zones, two level-20 zones --------------------------------------------------
[[probe]]
group = "where"
message = "where is the warrior trainer in northshire?"
expect = ["npc_911_0"]
zone = "Elwynn Forest"
area = "Northshire Valley"
[[probe]]
group = "where"
message = "who gives the wolves across the border quest"
expect = ["quest_33"]
zone = "Elwynn Forest"
area = "Northshire Valley"
[[probe]]
